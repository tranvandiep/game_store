<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Kiddy – Bộ Lọc Video & Playlist Theo Độ Tuổi</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary: #7C3AED;
      --primary-hover: #6D28D9;
      --primary-light: #EDE9FE;
      --accent: #F59E0B;
      --emerald: #059669;
      --emerald-light: #D1FAE5;
      --sky: #0284C7;
      --sky-light: #E0F2FE;
      --bg: #FFFBEB;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text: #0F172A;
      --text-muted: #64748B;
      --font-body: 'Nunito', sans-serif;
      --font-heading: 'Outfit', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 30%, #EDE9FE 70%, #E0F2FE 100%);
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      flex-direction: column;
      padding: 24px 16px 48px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      font-size: 46px;
      display: inline-block;
      margin-bottom: 6px;
      animation: bounceLogo 3s infinite ease-in-out;
    }

    @keyframes bounceLogo {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 900;
      color: #581C87;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 14.5px;
      font-weight: 700;
      color: #7E22CE;
      max-width: 680px;
      margin: 0 auto;
      line-height: 1.45;
    }

    /* ── Filter Panel ── */
    .filter-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 2.5px solid #FFFFFF;
      border-radius: 26px;
      padding: 20px 22px;
      box-shadow: 0 12px 32px rgba(109, 40, 217, 0.08);
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Search row */
    .search-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 11px 18px 11px 42px;
      border-radius: 999px;
      border: 2px solid #E2E8F0;
      background: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: #94A3B8;
      pointer-events: none;
    }

    .btn-reset-filters {
      padding: 10px 18px;
      border-radius: 999px;
      border: 2px solid #E2E8F0;
      background: #FFFFFF;
      color: #64748B;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-reset-filters:hover {
      background: #FEE2E2;
      border-color: #FCA5A5;
      color: #DC2626;
      transform: translateY(-1px);
    }

    /* Filter Section */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-title {
      font-size: 13px;
      font-weight: 900;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
    }

    /* Checkbox Chips Container */
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Custom Checkbox as Chip */
    .custom-checkbox {
      position: relative;
      user-select: none;
      cursor: pointer;
    }

    .custom-checkbox input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      cursor: pointer;
    }

    .checkbox-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      font-size: 13px;
      font-weight: 800;
      color: #475569;
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .checkbox-icon {
      width: 17px;
      height: 17px;
      border-radius: 5px;
      border: 2px solid #CBD5E1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: transparent;
      transition: all 0.15s ease;
      background: #FFFFFF;
      flex-shrink: 0;
    }

    .custom-checkbox:hover .checkbox-chip {
      border-color: #CBD5E1;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
    }

    /* Active / Checked State - Age Filter */
    .custom-checkbox.age-checkbox input:checked+.checkbox-chip {
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      border-color: #7C3AED;
      color: #FFFFFF;
      box-shadow: 0 5px 14px rgba(109, 40, 217, 0.28);
    }

    .custom-checkbox.age-checkbox input:checked+.checkbox-chip .checkbox-icon {
      border-color: #FFFFFF;
      background: #FFFFFF;
      color: #6D28D9;
    }

    /* Active / Checked State - Category Filter */
    .custom-checkbox.cat-checkbox input:checked+.checkbox-chip {
      background: linear-gradient(135deg, #10B981 0%, #047857 100%);
      border-color: #059669;
      color: #FFFFFF;
      box-shadow: 0 5px 14px rgba(5, 150, 105, 0.28);
    }

    .custom-checkbox.cat-checkbox input:checked+.checkbox-chip .checkbox-icon {
      border-color: #FFFFFF;
      background: #FFFFFF;
      color: #047857;
    }

    /* ── Results Info Bar ── */
    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 4px;
      font-size: 13.5px;
      font-weight: 800;
      color: #475569;
      flex-wrap: wrap;
      gap: 8px;
    }

    .result-count {
      background: #EDE9FE;
      color: #6D28D9;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 900;
      box-shadow: 0 2px 6px rgba(109, 40, 217, 0.1);
    }

    /* ── Video Grid ── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
    }

    .video-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 3px solid #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 10px 28px rgba(109, 40, 217, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      position: relative;
    }

    .video-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 36px rgba(109, 40, 217, 0.15);
    }

    /* Thumbnail wrap */
    .card-thumb-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      /* 16:9 ratio */
      background: #0F172A;
      overflow: hidden;
      cursor: pointer;
    }

    .card-thumb-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .video-card:hover .card-thumb-img {
      transform: scale(1.05);
    }

    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.9;
      transition: all 0.2s ease;
    }

    .video-card:hover .play-overlay {
      background: rgba(15, 23, 42, 0.15);
    }

    .play-btn-circle {
      width: 48px;
      height: 48px;
      background: #FF0000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(255, 0, 0, 0.45);
      transition: transform 0.2s ease;
    }

    .play-btn-circle svg {
      fill: #FFFFFF;
      width: 20px;
      height: 20px;
      margin-left: 2px;
    }

    .video-card:hover .play-btn-circle {
      transform: scale(1.15);
    }

    /* Card Content */
    .card-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 10px;
    }

    /* Badges Row */
    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge-age-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #FEF3C7;
      border: 1px solid #FDE68A;
      color: #92400E;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .badge-cat-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #D1FAE5;
      border: 1px solid #A7F3D0;
      color: #065F46;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.38;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
      flex: 1;
      transition: color 0.15s ease;
    }

    .card-title:hover {
      color: var(--primary);
    }

    /* Card Action */
    .card-action {
      margin-top: auto;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-add-mykiddy {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(109, 40, 217, 0.22);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-add-mykiddy:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(109, 40, 217, 0.35);
      background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%);
    }

    .btn-youtube-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      background: #FF0000;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 0, 0, 0.25);
      transition: all 0.15s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .btn-youtube-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 0, 0, 0.4);
      background: #E60000;
    }


    /* ── Empty State ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 26px;
      border: 2px dashed #CBD5E1;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 800;
      color: #334155;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13.5px;
      font-weight: 600;
      color: #94A3B8;
      max-width: 420px;
      margin: 0 auto 16px;
    }



    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0F172A;
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      z-index: 10000;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      body {
        padding: 14px 10px 32px;
      }

      h1 {
        font-size: 22px;
      }

      .filter-panel {
        padding: 16px 14px;
        gap: 14px;
      }

      .search-row {
        flex-direction: column;
      }

      .btn-reset-filters {
        width: 100%;
        justify-content: center;
      }

      .video-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Header -->
    <header>
      <div class="brand-logo">🎈📺🌟</div>
      <h1>My Kiddy – Bộ Lọc Video & Playlist</h1>
      <p class="subtitle">
        Lọc danh sách video giáo dục theo từng độ tuổi và môn học yêu thích cho bé
      </p>
    </header>

    <!-- Filter Panel -->
    <div class="filter-panel">
      <!-- Search & Reset -->
      <div class="search-row">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input"
            placeholder="Tìm kiếm theo tiêu đề video hoặc danh mục..." oninput="handleSearch()" />
        </div>
        <button class="btn-reset-filters" onclick="resetAllFilters()">
          <span>🔄</span> Đặt lại bộ lọc
        </button>
      </div>

      <!-- 1. Bộ Lọc Độ Tuổi (Checkbox Đa Chọn: Tất cả, 1 tuổi -> 10 tuổi) -->
      <div class="filter-section">
        <div class="filter-header">
          <span class="filter-title">
            <span>🎯</span> Lọc theo độ tuổi (Có thể chọn nhiều)
          </span>
          <span class="filter-badge" id="ageSelectedBadge">Đang xem: Tất cả</span>
        </div>
        <div class="checkbox-group" id="ageCheckboxGroup">
          <!-- Checkbox 'Tất cả' -->
          <label class="custom-checkbox age-checkbox">
            <input type="checkbox" id="ageCheckboxAll" value="all" checked onchange="toggleAgeAll(this.checked)" />
            <span class="checkbox-chip">
              <span class="checkbox-icon">✓</span>
              <span>🌈 Tất cả</span>
            </span>
          </label>

          <!-- Checkbox 1 -> 10 Tuổi (Tự động sinh hoặc cấu hình bên dưới) -->
          <!-- Sẽ được khởi tạo qua script renderAgeCheckboxes() -->
        </div>
      </div>

      <!-- 2. Bộ Lọc Danh Mục (Chỉ hiển thị khi dataList có dữ liệu categories) -->
      <div class="filter-section" id="categoryFilterSection" style="display: none;">
        <div class="filter-header">
          <span class="filter-title">
            <span>📚</span> Lọc theo danh mục môn học
          </span>
          <span class="filter-badge" id="catSelectedBadge"
            style="background: var(--emerald-light); color: var(--emerald);">
            Đang xem: Tất cả
          </span>
        </div>
        <div class="checkbox-group" id="categoryCheckboxGroup">
          <!-- Tự động sinh động từ dataList khi có categories -->
        </div>
      </div>
    </div>

    <!-- Results Info Bar -->
    <div class="results-bar">
      <span id="resultsSummary">Đang tải danh sách video...</span>
      <span class="result-count" id="resultCountBadge">0 Video</span>
    </div>

    <!-- Video Grid -->
    <div class="video-grid" id="videoGrid"></div>

  </div>



  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span>✅</span> <span id="toastMsg">Đã sao chép liên kết!</span>
  </div>

  <!-- Logic Script & Data -->
  <script>
    /**
     * DỮ LIỆU DANH SÁCH VIDEO (dataList)
     * Cấu trúc mỗi phần tử:
     * - title: Tên video hoặc playlist
     * - thumbnail: Link ảnh đại diện
     * - playlist: Đường dẫn video / playlist YouTube
     * - ages: Mảng các độ tuổi phù hợp [1, 2, ..., 10]
     * - categories: Mảng các danh mục (VD: ['Tiếng Anh', 'Toán', 'Nhạc', ...])
     * 
     * Lưu ý: Nếu dataList chưa có categories (mảng rỗng hoặc không có),
     * bộ lọc danh mục sẽ TỰ ĐỘNG ẨN đi.
     */

        categories: ["Chu Chu TV", "Tiếng Anh"]
      },
      {
        title: "ChuChu TV Sweet Dreams — Lullabies & Sleep Music",
        thumbnail: "https://i.ytimg.com/tvfilm_banner/PLb2OOMV9Cc78/16_9_.jpg?sqp=CMSU9dQG-oaymwEICIAKENAFSFqi85f_AwYIo-vC0gY=&rs=AOn4CLC4UM3J3nHfX-BMes85NX9m88HGgQ",
        playlist: "https://www.youtube.com/playlist?list=PLb2OOMV9Cc78",
        ages: [1, 2, 3],
        categories: ["Chu Chu TV", "Tiếng Anh"]
      },
      {
        title: "Bestie and Friends | Kids Learning Songs, Toy Stories, ABC, Numbers & Nursery Rhymes by ChuChu TV",
        thumbnail: "https://i.ytimg.com/tvfilm_banner/PLfhsUhQ9cf3c/16_9_.jpg?sqp=CO6g9dQG-oaymwEICIAKENAFSFqi85f_AwYIzfyt0gY=&rs=AOn4CLBm6J9Aun2GiDpx0zWUUCvtPhHQLg",
        playlist: "https://www.youtube.com/playlist?list=PLfhsUhQ9cf3c",
        ages: [1, 2, 3, 4],
        categories: ["Chu Chu TV", "Tiếng Anh"]
      },
      {
        title: "Bestie Quiet Playtime | Calm Music for Toddlers",
        thumbnail: "https://i.ytimg.com/vi/CUJcKAF5wG8/hqdefault.jpg?sqp=-oaymwEXCOADEI4CSFryq4qpAwkIARUAAIhCGAE=&rs=AOn4CLC_RgiqCKOQ1DvoJf9nD8ZlR5PGZg",
        playlist: "https://www.youtube.com/playlist?list=PLV-cxl3VSwWE_ocGSxzOhIrLp4X1cDcxk",
        ages: [1, 2, 3],
        categories: ["Chu Chu TV", "Tiếng Anh"]
      },
      {
        title: "ChuChu TV | Clear Voice & Minimal Music",
        thumbnail: "https://i.ytimg.com/vi/LgAeCU66puo/hqdefault.jpg?sqp=-oaymwEXCOADEI4CSFryq4qpAwkIARUAAIhCGAE=&rs=AOn4CLAvuT-26WszY8HyuA4i6Amg17WSLQ",
        playlist: "https://www.youtube.com/playlist?list=PLV-cxl3VSwWGBPzB3VNAgnU16ydEjj9b5",
        ages: [1, 2, 3, 4],
        categories: ["Chu Chu TV", "Tiếng Anh"]
      },
      {
        title: "Healthy Habits, Fruits & Vegetables Songs for Toddlers by ChuChu TV",
        thumbnail: "https://i.ytimg.com/vi/jd8E5OJYky4/hqdefault.jpg?sqp=-oaymwEXCOADEI4CSFryq4qpAwkIARUAAIhCGAE=&rs=AOn4CLA_nGmZnz7tFuw4hTRlFDj-lWBEPg",
        playlist: "https://www.youtube.com/playlist?list=PLV-cxl3VSwWGSXzGuAS6t8hfCMBvBL2B9",
        ages: [2, 3, 4, 5],
        categories: ["Chu Chu TV", "Tiếng Anh"]
      },

    // ── BIẾN QUẢN LÝ TRẠNG THÁI BỘ LỌC ──
    let selectedAges = [];        // Danh sách độ tuổi đang chọn (rỗng = Tất cả)
    let selectedCategories = [];  // Danh sách danh mục đang chọn (rỗng = Tất cả)
    let searchQuery = "";         // Từ khóa tìm kiếm

    // ── KHỞI TẠO KHI TẢI TRANG ──
    document.addEventListener("DOMContentLoaded", () => {
      initAgeCheckboxes();
      initCategoryCheckboxes();
      applyFiltersAndRender();
    });

    /**
     * 1. KHỞI TẠO BỘ LỌC ĐỘ TUỔI (1 Tuổi -> 10 Tuổi)
     */
    function initAgeCheckboxes() {
      const container = document.getElementById("ageCheckboxGroup");

      // Tạo các checkbox từ 1 đến 10 tuổi
      for (let age = 1; age <= 10; age++) {
        const label = document.createElement("label");
        label.className = "custom-checkbox age-checkbox";

        label.innerHTML = `
          <input type="checkbox" class="age-item-checkbox" value="${age}" onchange="handleAgeCheckboxChange()" />
          <span class="checkbox-chip">
            <span class="checkbox-icon">✓</span>
            <span>${age} tuổi</span>
          </span>
        `;
        container.appendChild(label);
      }
    }

    /**
     * Xử lý khi nhấn checkbox 'Tất cả' ở độ tuổi
     */
    function toggleAgeAll(checked) {
      const itemCheckboxes = document.querySelectorAll(".age-item-checkbox");
      if (checked) {
        // Bỏ chọn tất cả các checkbox tuổi con
        itemCheckboxes.forEach(cb => cb.checked = false);
        selectedAges = [];
      }
      updateAgeBadge();
      applyFiltersAndRender();
    }

    /**
     * Xử lý khi tick / bỏ tick từng độ tuổi (1 - 10)
     */
    function handleAgeCheckboxChange() {
      const allCheckbox = document.getElementById("ageCheckboxAll");
      const itemCheckboxes = document.querySelectorAll(".age-item-checkbox");

      // Lấy danh sách tuổi đang được tick
      selectedAges = Array.from(itemCheckboxes)
        .filter(cb => cb.checked)
        .map(cb => parseInt(cb.value));

      if (selectedAges.length === 0) {
        // Nếu không tick tuổi nào -> Tự động bật 'Tất cả'
        allCheckbox.checked = true;
      } else {
        // Nếu có tick tuổi cụ thể -> Bỏ tick 'Tất cả'
        allCheckbox.checked = false;
      }

      updateAgeBadge();
      applyFiltersAndRender();
    }

    function updateAgeBadge() {
      const badge = document.getElementById("ageSelectedBadge");
      if (selectedAges.length === 0) {
        badge.textContent = "Đang xem: Tất cả";
      } else {
        const sorted = [...selectedAges].sort((a, b) => a - b);
        badge.textContent = `Đang chọn: ${sorted.join(", ")} tuổi (${sorted.length})`;
      }
    }

    /**
     * 2. KHỞI TẠO BỘ LỌC DANH MỤC (Tự động phát hiện từ dataList)
     * NGUYÊN TẮC: Nếu dataList chưa có danh mục -> KHÔNG hiển thị phần này
     */
    function initCategoryCheckboxes() {
      const section = document.getElementById("categoryFilterSection");
      const container = document.getElementById("categoryCheckboxGroup");

      // Quét toàn bộ categories từ dataList
      const catSet = new Set();
      dataList.forEach(item => {
        if (Array.isArray(item.categories)) {
          item.categories.forEach(cat => {
            if (cat && typeof cat === "string" && cat.trim()) {
              catSet.add(cat.trim());
            }
          });
        }
      });

      const uniqueCategories = Array.from(catSet);

      // NẾU CHƯA CÓ DANH MỤC THÌ ẨN PHẦN BỘ LỌC NÀY
      if (uniqueCategories.length === 0) {
        section.style.display = "none";
        return;
      }

      // NẾU CÓ DANH MỤC THÌ HIỂN THỊ
      section.style.display = "flex";
      container.innerHTML = "";

      // Thêm checkbox 'Tất cả' danh mục
      const allCatLabel = document.createElement("label");
      allCatLabel.className = "custom-checkbox cat-checkbox";
      allCatLabel.innerHTML = `
        <input type="checkbox" id="catCheckboxAll" value="all" checked onchange="toggleCategoryAll(this.checked)" />
        <span class="checkbox-chip">
          <span class="checkbox-icon">✓</span>
          <span>🌈 Tất cả danh mục</span>
        </span>
      `;
      container.appendChild(allCatLabel);

      // Thêm từng danh mục có trong dữ liệu
      uniqueCategories.forEach(cat => {
        const label = document.createElement("label");
        label.className = "custom-checkbox cat-checkbox";
        label.innerHTML = `
          <input type="checkbox" class="cat-item-checkbox" value="${cat}" onchange="handleCategoryCheckboxChange()" />
          <span class="checkbox-chip">
            <span class="checkbox-icon">✓</span>
            <span>${cat}</span>
          </span>
        `;
        container.appendChild(label);
      });
    }

    function toggleCategoryAll(checked) {
      const itemCheckboxes = document.querySelectorAll(".cat-item-checkbox");
      if (checked) {
        itemCheckboxes.forEach(cb => cb.checked = false);
        selectedCategories = [];
      }
      updateCategoryBadge();
      applyFiltersAndRender();
    }

    function handleCategoryCheckboxChange() {
      const allCheckbox = document.getElementById("catCheckboxAll");
      const itemCheckboxes = document.querySelectorAll(".cat-item-checkbox");

      selectedCategories = Array.from(itemCheckboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);

      if (selectedCategories.length === 0) {
        if (allCheckbox) allCheckbox.checked = true;
      } else {
        if (allCheckbox) allCheckbox.checked = false;
      }

      updateCategoryBadge();
      applyFiltersAndRender();
    }

    function updateCategoryBadge() {
      const badge = document.getElementById("catSelectedBadge");
      if (!badge) return;
      if (selectedCategories.length === 0) {
        badge.textContent = "Đang xem: Tất cả";
      } else {
        badge.textContent = `Đang chọn: ${selectedCategories.join(", ")} (${selectedCategories.length})`;
      }
    }

    /**
     * 3. TÌM KIẾM THEO TỪ KHÓA
     */
    function handleSearch() {
      searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
      applyFiltersAndRender();
    }

    /**
     * 4. RESET TOÀN BỘ BỘ LỌC
     */
    function resetAllFilters() {
      document.getElementById("searchInput").value = "";
      searchQuery = "";

      // Reset tuổi
      const ageAll = document.getElementById("ageCheckboxAll");
      if (ageAll) ageAll.checked = true;
      document.querySelectorAll(".age-item-checkbox").forEach(cb => cb.checked = false);
      selectedAges = [];
      updateAgeBadge();

      // Reset danh mục
      const catAll = document.getElementById("catCheckboxAll");
      if (catAll) catAll.checked = true;
      document.querySelectorAll(".cat-item-checkbox").forEach(cb => cb.checked = false);
      selectedCategories = [];
      updateCategoryBadge();

      applyFiltersAndRender();
    }

    /**
     * 5. HÀM THỰC HIỆN LỌC VÀ HIỂN THỊ DANH SÁCH VIDEO
     */
    function applyFiltersAndRender() {
      const filtered = dataList.filter(item => {
        // 1. Lọc theo độ tuổi (nếu selectedAges rỗng => chọn tất cả)
        if (selectedAges.length > 0) {
          const itemAges = Array.isArray(item.ages) ? item.ages : [];
          // Video phù hợp nếu chứa ít nhất 1 độ tuổi đang chọn
          const matchAge = selectedAges.some(age => itemAges.includes(age));
          if (!matchAge) return false;
        }

        // 2. Lọc theo danh mục (nếu selectedCategories rỗng => chọn tất cả)
        if (selectedCategories.length > 0) {
          const itemCats = Array.isArray(item.categories) ? item.categories : [];
          const matchCat = selectedCategories.some(cat => itemCats.includes(cat));
          if (!matchCat) return false;
        }

        // 3. Lọc theo từ khóa tìm kiếm
        if (searchQuery.length > 0) {
          const matchTitle = (item.title || "").toLowerCase().includes(searchQuery);
          const matchCatText = (Array.isArray(item.categories) ? item.categories.join(" ") : "").toLowerCase().includes(searchQuery);
          if (!matchTitle && !matchCatText) return false;
        }

        return true;
      });

      renderVideoGrid(filtered);
    }

    /**
     * 6. RENDER GIAO DIỆN GRID VIDEO
     */
    function renderVideoGrid(items) {
      const grid = document.getElementById("videoGrid");
      const countBadge = document.getElementById("resultCountBadge");
      const summary = document.getElementById("resultsSummary");

      countBadge.textContent = `${items.length} Video`;
      summary.textContent = `Tìm thấy ${items.length} video phù hợp với tiêu chí lọc`;

      // Trạng thái trống (Empty State)
      if (items.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍🍃</div>
            <div class="empty-title">Không tìm thấy video nào</div>
            <div class="empty-desc">
              Không có video phù hợp với độ tuổi hoặc danh mục bạn đang chọn. Hãy thử nới lỏng bộ lọc nhé!
            </div>
            <button class="btn-reset-filters" style="margin: 0 auto;" onclick="resetAllFilters()">
              <span>🔄</span> Đặt lại tất cả bộ lọc
            </button>
          </div>
        `;
        return;
      }

      // Render danh sách thẻ video
      grid.innerHTML = items.map((item, index) => {
        const agesText = Array.isArray(item.ages) && item.ages.length > 0
          ? `${Math.min(...item.ages)} - ${Math.max(...item.ages)} tuổi`
          : "Mọi lứa tuổi";

        const catsHtml = Array.isArray(item.categories) && item.categories.length > 0
          ? item.categories.map(c => `<span class="badge-cat-tag">🏷️ ${c}</span>`).join("")
          : "";

        const escapedTitle = (item.title || "").replace(/'/g, "\\'").replace(/"/g, "&quot;");
        const playlistUrl = item.playlist || "#";

        return `
          <div class="video-card">
            <!-- Thumbnail & Nút Play (Click mở YouTube) -->
            <div class="card-thumb-wrap" onclick="openYouTube('${playlistUrl}')">
              <img class="card-thumb-img" src="${item.thumbnail}" alt="${escapedTitle}" loading="lazy" />
              <div class="play-overlay">
                <div class="play-btn-circle">
                  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
              </div>
            </div>

            <!-- Nội dung thẻ -->
            <div class="card-body">
              <div class="card-badges">
                <span class="badge-age-tag">👶 ${agesText}</span>
                ${catsHtml}
              </div>

              <h2 class="card-title" onclick="openYouTube('${playlistUrl}')" title="${escapedTitle}">
                ${item.title}
              </h2>

              <div class="card-action">
                <button class="btn-add-mykiddy" onclick="shareToMyKiddy('${escapedTitle}', '${playlistUrl}')">
                  <span>➕</span> Thêm vào My Kiddy
                </button>
                <button class="btn-youtube-link" title="Mở playlist trên YouTube" onclick="openYouTube('${playlistUrl}')">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                  <span>YouTube</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    /**
     * 7. CHỨC NĂNG CHIA SẺ VÀO MY KIDDY
     */
    function shareToMyKiddy(title, url) {
      if (navigator.share) {
        navigator.share({
          title: title,
          text: `Thêm vào My Kiddy: ${title}`,
          url: url,
        }).then(() => {
          showToast("Đã chia sẻ vào My Kiddy thành công! 🎉");
        }).catch((err) => {
          if (err && err.name !== "AbortError") {
            showToast("Không thể thực hiện chia sẻ lúc này.");
          }
        });
      } else {
        showToast("Thiết bị hoặc trình duyệt không hỗ trợ tính năng chia sẻ.");
      }
    }

    /**
     * 8. MỞ PLAYLIST TRỰC TIẾP TRÊN YOUTUBE
     */
    function openYouTube(url) {
      if (!url || url === "#") {
        alert("Đường dẫn YouTube chưa được cấu hình!");
        return;
      }
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }
  </script>
</body>
